name: Build and publish image

# Builds the single app+API image (frontend built and bundled in) and pushes it
# to GitHub Container Registry, so a compose-only deployer (Dockhand) can pull it
# with no build context on the host.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/s39n/lastdone-push:latest
            ghcr.io/s39n/lastdone-push:${{ github.sha }}
